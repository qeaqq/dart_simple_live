name: app-build-ios
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: 

jobs:
  build-ios:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      # 1. 签出代码
      - uses: actions/checkout@v4

      # 2. 设置 Flutter 环境
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      # 3. 修复并恢复 Flutter 依赖
      - name: Restore packages
        run: |
          cd simple_live_app
          flutter pub get

      # 4. 关键修复：安装 iOS 的 CocoaPods 依赖
      - name: Install CocoaPods Dependencies
        run: |
          cd simple_live_app/ios
          pod install --repo-update

      # 5. 编译 iOS 产物
      - name: Build IPA
        run: |
          cd simple_live_app
          flutter build ios --release --no-codesign

      # 6. 打包未签名的 .ipa 安装包
      - name: Create IPA Container
        run: |
          cd simple_live_app
          mkdir -p build/ios/iphoneos/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/Runner.app
          cd build/ios/iphoneos/
          zip -q -r ios_no_sign.ipa Payload
          cd ../../..

      # 7. 上传到 Actions 产物区
      - name: Upload IPA to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: simple_live_app/build/ios/iphoneos/ios_no_sign.ipa

      # 8. 读取版本号
      - name: Read version info
        id: version
        uses: juliangruber/read-file-action@v1
        with:
          path: assets/app_version.json

      # 9. 自动发布到 Release
      - name: Upload iOS to Release
        uses: softprops/action-gh-release@v1
        with:
          name: "${{ fromJson(steps.version.outputs.content).version }}"
          body: "${{ fromJson(steps.version.outputs.content).version_desc }}"
          prerelease: ${{ fromJson(steps.version.outputs.content).prerelease }}
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0-ios-test' }}
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            simple_live_app/build/ios/iphoneos/ios_no_sign.ipa

      - run: echo "🍏 iOS Build job status is ${{ job.status }}."
