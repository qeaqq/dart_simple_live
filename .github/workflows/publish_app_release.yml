name: app-build-ios

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      # 1. 签出代码
      - uses: actions/checkout@v4

      # 2. 设置 Flutter 环境
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      # 3. 恢复基础依赖
      - name: Restore packages
        run: |
          cd simple_live_app
          flutter pub get

      # 4a. 强制降级 connectivity_plus（消灭 isUltraConstrained 报错）
      - name: Force downgrade connectivity_plus
        run: |
          cd simple_live_app
          flutter pub add connectivity_plus:6.1.1

      # 4b. 强制降级 device_info_plus（消灭 isiOSAppOnVision 报错）
      #     device_info_plus 12.x 引用了 iOS 16+ SDK 的 isiOSAppOnVision API
      #     降级到 10.1.2 可彻底规避该问题
      - name: Force downgrade device_info_plus
        run: |
          cd simple_live_app
          flutter pub add device_info_plus:10.1.2

      # 5. 清理并重新安装 iOS 依赖
      - name: Clean and Install CocoaPods
        run: |
          cd simple_live_app
          flutter clean
          flutter pub get
          cd ios
          pod install --repo-update

      # 6. 编译 iOS 产物
      - name: Build IPA
        run: |
          cd simple_live_app
          flutter build ios --release --no-codesign

      # 7. 打包未签名的 .ipa 安装包
      - name: Create IPA Container
        run: |
          cd simple_live_app
          mkdir -p build/ios/iphoneos/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/Runner.app
          cd build/ios/iphoneos/
          zip -q -r ios_no_sign.ipa Payload
          cd ../../..

      # 8. 上传到 Actions 产物区
      - name: Upload IPA to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: simple_live_app/build/ios/iphoneos/ios_no_sign.ipa

      # 9. 读取版本号
      - name: Read version info
        id: version
        uses: juliangruber/read-file-action@v1
        with:
          path: assets/app_version.json

      # 10. 自动发布到 Release
      - name: Upload iOS to Release
        uses: softprops/action-gh-release@v1
        with:
          name: "${{ fromJson(steps.version.outputs.content).version }}"
          body: "${{ fromJson(steps.version.outputs.content).version_desc }}"
          prerelease: ${{ fromJson(steps.version.outputs.content).prerelease }}
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0-ios-test' }}
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            simple_live_app/build/ios/iphoneos/ios_no_sign.ipa

      - run: echo "🍏 iOS Build job status is ${{ job.status }}."
